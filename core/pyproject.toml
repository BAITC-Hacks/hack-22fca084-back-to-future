[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astana-city-core"
version = "0.1.0"
description = "Deterministic calculation core for the Astana city simulator"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["city_core*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
