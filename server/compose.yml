services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:${API_PORT:?Set API_PORT in .env}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"
  api-check:
    profiles: [check]
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: check
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
